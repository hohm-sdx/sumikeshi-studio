# 公開したファイルだけで、全件のテストを流す（main に入ったときと、手で動かしたとき）
name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 画面のテストに要るライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglx0 libglvnd0 libegl1 libopengl0 \
            libxkbcommon0 libdbus-1-3 libfreetype6 libfontconfig1
      # uv は、バージョンを固定した配布ファイルを取得し、ここに書いた SHA-256 と照合してから入れる（合わなければ止まる）。
      # 配布元の導入スクリプトを取得して実行すると、配布元が改ざんされたときに別のプログラムが動くおそれがあるため
      - name: uv（バージョンと SHA-256 を固定する）
        env:
          UV_VERSION: "0.13.6"
          UV_SHA256: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
        run: |
          archive="$RUNNER_TEMP/uv.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu/uv" "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu/uvx" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 環境を作る
        run: uv sync --locked
      - name: テスト
        run: uv run pytest -n 4 -m "regression or not regression" -rs
